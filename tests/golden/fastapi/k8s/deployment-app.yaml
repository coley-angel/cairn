apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  labels:
    cairn.dev/app: fastapi
    cairn.dev/role: app
spec:
  replicas: 1
  selector:
    matchLabels:
      cairn.dev/app: fastapi
      cairn.dev/role: app
  template:
    metadata:
      labels:
        cairn.dev/app: fastapi
        cairn.dev/role: app
        cairn.dev/paradigm: fastapi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cairn.dev/fastapi:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-edge
  labels:
    cairn.dev/app: fastapi
data:
  Caddyfile: |
    {
    	auto_https off
    	admin off
    }

    :8080 {
    	route {
    		request_header -X-Auth-Request-User
    		request_header -X-Auth-Request-Email
    		request_header -X-Auth-Request-Groups
    		request_header -X-Auth-Request-Preferred-Username
    		request_header -X-Auth-Request-Access-Token
    		request_header -X-Forwarded-User
    		request_header -X-Forwarded-Email
    		request_header -X-Forwarded-Groups
    		request_header -X-Forwarded-Preferred-Username
    		request_header -X-Forwarded-Access-Token
    		request_header -Authorization
    		handle /oauth2/* {
    			reverse_proxy 127.0.0.1:4180 {
    				header_up X-Real-IP {remote_host}
    				header_up X-Forwarded-Uri {uri}
    			}
    		}
    		handle /healthz {
    			reverse_proxy app:8000 {
    				header_up -X-Auth-Request-User
    				header_up -X-Auth-Request-Email
    				header_up -X-Auth-Request-Groups
    				header_up -X-Auth-Request-Preferred-Username
    				header_up -X-Auth-Request-Access-Token
    				header_up -X-Forwarded-User
    				header_up -X-Forwarded-Email
    				header_up -X-Forwarded-Groups
    				header_up -X-Forwarded-Preferred-Username
    				header_up -X-Forwarded-Access-Token
    				header_up -Authorization
    			}
    		}
    		handle {
    			forward_auth 127.0.0.1:4180 {
    				uri /oauth2/auth
    				header_up -X-Auth-Request-User
    				header_up -X-Auth-Request-Email
    				header_up -X-Auth-Request-Groups
    				header_up -X-Auth-Request-Preferred-Username
    				header_up -X-Auth-Request-Access-Token
    				header_up -X-Forwarded-User
    				header_up -X-Forwarded-Email
    				header_up -X-Forwarded-Groups
    				header_up -X-Forwarded-Preferred-Username
    				header_up -X-Forwarded-Access-Token
    				header_up -Authorization
    				header_up X-Real-IP {remote_host}
    				header_up X-Forwarded-Uri {uri}
    				copy_headers X-Auth-Request-User X-Auth-Request-Email X-Auth-Request-Groups X-Auth-Request-Preferred-Username
    				@denied status 401
    				handle_response @denied {
    					redir * /oauth2/sign_in?rd={scheme}://{host}{uri} 302
    				}
    			}
    			reverse_proxy app:8000
    		}
    	}
    }
  oauth2-proxy.cfg: |
    provider = "oidc"
    oidc_issuer_url = "https://idp.example.com"
    redirect_url = "http://localhost:8080/oauth2/callback"
    upstreams = ["static://202"]
    http_address = "127.0.0.1:4180"
    reverse_proxy = true
    trusted_proxy_ips = ["127.0.0.1"]
    email_domains = ["example.com"]
    set_xauthrequest = true
    set_basic_auth = false
    set_authorization_header = false
    pass_basic_auth = false
    pass_user_headers = false
    pass_access_token = false
    pass_authorization_header = false
    skip_auth_strip_headers = true
    cookie_secure = false
    cookie_httponly = true
    cookie_samesite = "lax"
    cookie_name = "_cairn"
    code_challenge_method = "S256"
    insecure_oidc_skip_nonce = false
    insecure_oidc_allow_unverified_email = false
    ssl_insecure_skip_verify = false
    show_debug_on_error = false
    display_htpasswd_form = false
    session_cookie_minimal = true
    force_https = false
    whitelist_domains = ["localhost"]
    scope = "openid email profile"
    oidc_groups_claim = "groups"
    real_client_ip_header = "X-Real-IP"

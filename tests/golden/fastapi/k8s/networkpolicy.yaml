apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastapi-app
  labels:
    cairn.dev/app: fastapi
spec:
  podSelector:
    matchLabels:
      cairn.dev/app: fastapi
      cairn.dev/role: app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cairn.dev/app: fastapi
              cairn.dev/role: edge
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastapi-edge
  labels:
    cairn.dev/app: fastapi
spec:
  podSelector:
    matchLabels:
      cairn.dev/app: fastapi
      cairn.dev/role: edge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080

name: fastapi
services:
  edge:
    image: caddy:2.9.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      cairn:
        ipv4_address: 172.30.10.2
    depends_on:
      - auth
      - app
  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    command: ["--config", "/etc/cairn/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
    volumes:
      - ./oauth2-proxy.cfg:/etc/cairn/oauth2-proxy.cfg:ro
    networks:
      cairn:
        ipv4_address: 172.30.10.3
  app:
    build:
      context: ..
      dockerfile: .cairn/Dockerfile.app
    environment:
      PORT: "8000"
    networks:
      cairn:
        ipv4_address: 172.30.10.4
networks:
  cairn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
